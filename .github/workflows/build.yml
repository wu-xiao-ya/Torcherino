name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: torcherino-cleanroom
          path: |
            build/libs/*.jar
            build/reports/**
            docs/adapter-compatibility-matrix.md
