plugins {
    id 'java'
    id 'java-library'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
}

version = mod_version
group = 'com.sci.torcherino'

base {
    archivesName = 'torcherino'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Arcseekers'
        url = 'https://maven.arcseekers.com/releases'
    }
    maven {
        name = 'Cleanroom'
        url = 'https://maven.cleanroommc.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
}

configurations {
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

sourceSets {
    benchmarkHarness {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp('stable', '39-1.12')
    }

    cleanroom {
        loader cleanroom_loader_version
        runs.all {
            args += ['--username', 'Developer']
        }
    }

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

unimined.minecraft(sourceSets.benchmarkHarness) {
    from sourceSets.main
    defaultRemapJar = true
    defaultRemapSourcesJar = false
}

dependencies {
    compileOnly "com.cleanroommc:sponge-mixin:${mixin_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.4.0'
    testImplementation 'it.unimi.dsi:fastutil:8.5.18'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.4.0'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    filesMatching('mcmod.info') {
        expand(
            version: project.version,
            mcversion: '1.12.2'
        )
    }
}

tasks.named('processBenchmarkHarnessResources') {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    filesMatching('mcmod.info') {
        expand(
            version: project.version,
            mcversion: '1.12.2'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

test {
    useJUnitPlatform()
    classpath += tasks.named('compileJava').get().classpath
}

tasks.named('compileTestJava') {
    classpath += tasks.named('compileJava').get().classpath
}

tasks.register('schedulerBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses')
    mustRunAfter tasks.named('test')
    classpath = sourceSets.test.runtimeClasspath + tasks.named('compileJava').get().classpath
    mainClass = 'com.sci.torcherino.benchmark.CoverageBenchmarkMain'
    args layout.buildDirectory.file('reports/torcherino/scheduler-benchmark.md')
        .get().asFile.absolutePath
}

jar {
    archiveClassifier = 'dev'
    manifest {
        attributes(
            'ForceLoadAsMod': 'true'
        )
    }
}

tasks.named('remapJar') {
    archiveClassifier = ''
}

tasks.named('benchmarkHarnessJar') {
    archiveBaseName = 'torcherino-benchmark-harness'
    archiveClassifier = 'dev'
    manifest {
        attributes(
            'ForceLoadAsMod': 'true'
        )
    }
}

tasks.named('remapBenchmarkHarnessJar') {
    archiveBaseName = 'torcherino-benchmark-harness'
    archiveClassifier = ''
}

tasks.register('verifyPublishedJarManifest') {
    dependsOn tasks.named('remapJar')

    doLast {
        def publishedJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def jarFile = new java.util.jar.JarFile(publishedJar)
        try {
            def attributes = jarFile.manifest.mainAttributes
            if (attributes.getValue('ModType') != null) {
                throw new GradleException(
                    "Published jar must not declare ModType; CatRoom may skip the Forge @Mod container"
                )
            }
            if (!'true'.equalsIgnoreCase(attributes.getValue('ForceLoadAsMod'))) {
                throw new GradleException(
                    "Published jar must declare ForceLoadAsMod: true for hybrid server discovery"
                )
            }
            if (attributes.getValue('MixinConfigs') != null) {
                throw new GradleException(
                    "Published jar must not activate a Mixin config until it contains required mixins"
                )
            }
        } finally {
            jarFile.close()
        }
    }
}

tasks.register('verifyBenchmarkHarnessJar') {
    dependsOn tasks.named('remapBenchmarkHarnessJar')

    doLast {
        def harnessJar = tasks.named('remapBenchmarkHarnessJar').get().archiveFile.get().asFile
        def jarFile = new java.util.jar.JarFile(harnessJar)
        try {
            def attributes = jarFile.manifest.mainAttributes
            if (!'true'.equalsIgnoreCase(attributes.getValue('ForceLoadAsMod'))) {
                throw new GradleException(
                    "Benchmark harness must declare ForceLoadAsMod: true for CatRoom discovery"
                )
            }
            if (jarFile.getEntry('com/sci/torcherino/Torcherino.class') != null) {
                throw new GradleException(
                    "Benchmark harness must not contain Torcherino production classes"
                )
            }
        } finally {
            jarFile.close()
        }
    }
}

build.dependsOn tasks.named('remapJar')
build.dependsOn tasks.named('schedulerBenchmark')
build.dependsOn tasks.named('verifyPublishedJarManifest')
build.dependsOn tasks.named('verifyBenchmarkHarnessJar')
